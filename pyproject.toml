[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xxautoenv"
version = "0.1.0"
description = "Local deployment nodes for native SpiffWorkflow graphs"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["SpiffWorkflow==3.2.0", "rich==15.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xxautoenv*"]
